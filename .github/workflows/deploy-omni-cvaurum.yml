name: Deploy OmniStudio with CVAurum

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'models/CVAurum-main/**'
      - '.github/workflows/deploy-omni-cvaurum.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: models/CVAurum-main/package-lock.json

      - name: Install CVAurum dependencies
        working-directory: models/CVAurum-main
        run: npm ci

      - name: Build CVAurum
        working-directory: models/CVAurum-main
        run: npm run build

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/models/CVAurum-main
          cp index.html _site/index.html
          cp -R models/CVAurum-main/dist/. _site/models/CVAurum-main/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
